name: Tests

# Runs the test suite on every push to main and on all PRs.
# The dotenv test needs a .env file; it is materialized from the
# OPENROUTER_API_KEY repo secret. Fork PRs have no access to secrets,
# so the test skips itself when no .env is present.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev/app extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,app]"

      - name: Materialize .env from secret (if available)
        if: ${{ secrets.OPENROUTER_API_KEY != '' }}
        run: echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" > .env

      - name: Run tests
        run: python -m pytest tests --disable-warnings -q
