[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "conninfpy"
dynamic = ["version"]
description = "Unified Python framework for permutation-based statistical inference on brain connectivity networks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Irina Knyazeva", email = "knyazeva@ihb.spb.ru" },
]
maintainers = [
    { name = "Irina Knyazeva", email = "knyazeva@ihb.spb.ru" },
]
keywords = [
    "neuroimaging", "connectivity", "fmri",
    "network-based-statistics", "tfnbs", "glm", "permutation-testing",
    "fwer", "fdr", "combat",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    # The package itself is pure Python, but the numba/llvmlite dependency
    # ships binary wheels only for these platforms, and its macOS wheels are
    # Apple Silicon (arm64) only — see the numba note under dependencies.
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Mathematics",
]
# Supported Pythons: 3.12, 3.13, 3.14 — exactly what the classifiers
# advertise and what CI (tests.yml / publish.yml) tests on Linux, Windows
# and macOS (arm64). The upper bound tracks the tested matrix rather than
# numba wheel availability (numba already ships 3.15 wheels): an uncapped
# ">=3.12" would advertise an untested interpreter. Lift the cap in a new
# release once CI covers the next Python.
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy",
    "scipy",
    "statsmodels",
    "pandas",
    "matplotlib",
    # 0.63 is the first release supporting Python 3.14; numba selects its
    # compatible llvmlite dependency. macOS support is Apple Silicon (arm64)
    # only: numba >= 0.63 / llvmlite >= 0.46 publish no macOS x86_64 wheels
    # on PyPI (checked for 0.63.0/0.46.0 and 0.68.0/0.50.0), so Intel Macs
    # would fall back to an llvmlite source build and are not supported.
    "numba>=0.63",
    # conninfpy.sim (generate_fc_matrices, generate_multisite_glm_dataset)
    # and the ML-transfer examples; also pulled in by nilearn for the app.
    "scikit-learn",
    # Usable CPU count respects affinity/container quotas/LOKY_MAX_CPU_COUNT.
    # Also required transitively by scikit-learn; used directly by stats._engine.
    "joblib",
    # Caps BLAS/OpenMP threads inside permutation workers (stats._workers);
    # without it the pool oversubscribes the CPU.
    "threadpoolctl",
    # conninfpy.loaders.manifest imports yaml at module level, and the
    # loaders subpackage is pulled in by the top-level __init__, so a
    # core install is unusable without it. Keep in core, not an extra.
    "pyyaml",
    # Atlas label images and Brainnetome annotation (conninfpy.atlas,
    # conninfpy.interpret.annotate).
    "nibabel>=3.2",
]

[project.scripts]
conninfpy = "conninfpy.cli:main"

[project.urls]
Documentation = "https://ihb-ibr-department.github.io/ConnInfPy/"
Source = "https://github.com/IHB-IBR-department/ConnInfPy"
"Issue Tracker" = "https://github.com/IHB-IBR-department/ConnInfPy/issues"

[project.optional-dependencies]
app = [
    "streamlit>=1.47",
    "pyyaml",
    "networkx",
    "nibabel>=3.2",
    "nilearn>=0.10.1",  # "zscore_sample" standardization
]
full = [
    "pyyaml",
    "networkx",
]
dev = [
    "pytest",
    "ruff",
    "sphinx",
    "sphinx-rtd-theme",
    "myst-parser",
    "seaborn",
    "mypy",
    "pyyaml",
    "networkx",
    # examples/simulations/fpr/fpr_calibration.py imports tqdm at module level
    # and tests/test_examples_structure.py collects it; publish.yml installs
    # only .[dev,app] before running pytest.
    "tqdm",
]
notebooks = [
    "jupyter",
    "ipykernel",
    "seaborn",
]

[tool.setuptools.packages.find]
include = ["conninfpy*"]

[tool.setuptools.package-data]
conninfpy = ["atlas_data/*.csv", "atlas_data/*.txt", "atlas_data/*.json", "app/assets/*.png"]

[tool.setuptools.dynamic]
version = {attr = "conninfpy._version.__version__"}

[tool.pytest.ini_options]
filterwarnings = [
    # Expected from synthetic fixtures (r = ±1 edges); asserted in
    # tests/test_utils.py::TestFisherRToZ.
    "ignore:Input contains r = ±1:UserWarning",
    "ignore:divide by zero encountered in arctanh:RuntimeWarning",
]

# Run: ruff check (from the repository root; CI lint job).
[tool.ruff]
target-version = "py312"
# Research scripts and the manuscript figure builders are tracked separately
# from the package lint; the package, its tests and maintained scripts are
# checked with zero findings.
extend-exclude = ["examples", "paper"]

[tool.ruff.lint]
# F (pyflakes: unused imports/variables, undefined names), E9 (syntax errors),
# B023 (loop variable captured by a closure), B905 (zip without strict=).
select = ["F", "E9", "B023", "B905"]

[tool.ruff.lint.per-file-ignores]
# The names not listed in ``__all__`` are deliberate backward-compatible
# re-exports of the top-level package (see the module docstring).
"conninfpy/__init__.py" = ["F401"]

# Run: python -m mypy conninfpy.
[tool.mypy]
python_version = "3.12"
files = ["conninfpy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_calls = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false

# Scientific stack without complete type stubs.
[[tool.mypy.overrides]]
module = [
    "scipy.*", "sklearn.*", "nilearn.*",
    "tqdm.*", "numba.*", "yaml.*",
    "pandas.*", "networkx.*",
    "joblib.*", "threadpoolctl.*", "streamlit.*",
]
ignore_missing_imports = true

# The Streamlit application (``conninfpy.app``) is untyped UI glue: its
# function bodies are not type-checked until it is annotated. Every other
# check (imports, typed definitions, calls) stays on for it.
[[tool.mypy.overrides]]
module = ["conninfpy.app.*"]
check_untyped_defs = false
