# Exact-integration (n=None) NI-TFNBS and FBC-TFNBS Power Analysis (E=0.4, H=3.0)
#
# Companion to sweep_config_tfnbs_exact_04_30.yaml on the identical simulated
# datasets (seed=42, 60 nodes, 4 modules, n_samples=30, 100 repeats x 1000 perms).

effect_sizes:
  - 0.075
  - 0.125
  - 0.25

n_samples: 30

sample_sizes:
  - 10
  - 30
  - 50
  - 100

effect_size: 0.125

scenarios:
  - within_module_dense
  - between_modules_dense
  - partial_bipartite_between_modules
  - gradient_core_periphery_within_module
  - scattered_cross_block
  - hub
  - rich_club
  - cross_block_connected_chain
  - chain
  - fragmented_within_module

methods:
  - ni_tfnbs_exact
  - fbc_tfnbs_exact

tfnbs_options:
  e: 0.4
  h: 3.0
  n_thresholds: 10
  start_thres: 1.65
  fbc_min_cluster_size: 3

nbs_options:
  threshold: [2.0, 3.0]

n_repeats: 100
n_permutations: 1000
alpha: 0.05

n_nodes: 60
n_modules: 4
intra_corr: 0.3
inter_corr: 0.05
noise_level: 0.05
time_points: 30

seed: 42
n_jobs: -1
output_dir: ../results/power/power_ni_fbc_exact_04_30
