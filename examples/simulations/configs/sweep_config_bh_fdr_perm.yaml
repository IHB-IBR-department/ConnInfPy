# BH-FDR Permutation Experiment (Exp 5)
#
# Compares permutation-based BH-FDR against parametric BH-FDR and
# other methods as a fairer non-topological comparator.
#
# Usage:
#   python examples/simulations/power/power_analysis.py \
#     --config examples/simulations/configs/sweep_config_bh_fdr_perm.yaml \
#     --output-dir examples/simulations/results/sensitivity/bh_fdr_perm \
#     --mode effect-size

effect_sizes:    # Delta r (shift of the population correlation)
  - 0.125
  - 0.25

n_samples: 30

scenarios:
  - hub
  - rich_club
  - chain
  - between_modules_dense

methods:
  - bh_fdr_perm
  - bh_fdr         # parametric control
  - tfnbs          # topological control
  - ni_tfnbs
  - fbc_tfnbs

tfnbs_options:
  e: [0.4]
  h: [3.0]
  n_thresholds: 10
  start_thres: 1.65
  fbc_min_cluster_size: 3

n_repeats: 100
n_permutations: 1000
alpha: 0.05

n_nodes: 60
n_modules: 4
intra_corr: 0.3
inter_corr: 0.05
noise_level: 0.05
time_points: 30
seed: 42
