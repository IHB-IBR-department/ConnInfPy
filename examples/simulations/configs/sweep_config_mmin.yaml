# FBC-TFNBS m_min Sensitivity Experiment (Exp 3)
#
# Sweeps min_cluster_size in {1, 2, 3, 5, 10} for FBC-TFNBS.
# Run 5 times with --fbc-min-cluster: 1, 2, 3, 5, 10
#
# Usage:
#   for M in 1 2 3 5 10; do
#     python examples/simulations/power/power_analysis.py \
#       --config examples/simulations/configs/sweep_config_mmin.yaml \
#       --fbc-min-cluster $M \
#       --output-dir examples/simulations/results/sensitivity/mmin/mmin_$M \
#       --mode effect-size
#   done

effect_sizes:    # Delta r (shift of the population correlation)
  - 0.125
  - 0.25

n_samples: 30

scenarios:
  - hub
  - rich_club
  - chain
  - between_modules_dense

methods:
  - fbc_tfnbs

tfnbs_options:
  e: [0.4]
  h: [3.0]
  n_thresholds: 10
  start_thres: 1.65
  fbc_min_cluster_size: 3   # overridden by --fbc-min-cluster CLI

n_repeats: 100
n_permutations: 1000
alpha: 0.05

n_nodes: 60
n_modules: 4
intra_corr: 0.3
inter_corr: 0.05
noise_level: 0.05
time_points: 30
seed: 42
